<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Cabine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <!-- Background toujours visible -->
    <div class="background"></div>

    <div class="container">

      <!-- Question : apparaît en premier -->
      <div class="question-wrapper" id="question-wrapper" style="opacity:0">
        <h1 class="question" id="question-text"></h1>
      </div>

      <!-- Phrase + image : apparaissent après -->
      <div class="bottom-wrapper" id="bottom-wrapper" style="opacity:0">
        <p class="instruction">Appuyer sur le bouton pour commencer l'enregistrement (30 secondes)</p>
        <img class="media" src="/streamdeck.svg" alt="" />
      </div>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
